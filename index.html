<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">Tasks</div>
    <div class="search-box">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">Add</button>
    </div>
  </header>

  <div class="subnav">
    <div class="tabs" id="tabsContainer"></div>
    <div class="group-controls">
      <input type="text" id="newGroupInput" placeholder="New group...">
      <button id="addGroupBtn">+ Group</button>
      <button id="deleteGroupBtn" class="btn-text-danger">Delete Group</button>
    </div>
  </div>

  <main class="grid-container" id="taskGrid"></main>

  <script src="script.js"></script>
</body>
</html>
