<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Style Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">task<span>store</span></div>
    
    <div class="search-box">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">Add Task</button>
    </div>
  </header>

  <div class="subnav">
    <select id="categorySelect">
      <option value="Personal">Personal</option>
      <option value="Work">Work</option>
      <option value="Assignments">Assignments</option>
    </select>

    <div class="group-control">
      <input type="text" id="newGroupInput" placeholder="New group name...">
      <button id="addGroupBtn">+ Add Group</button>
      <button id="deleteGroupBtn" class="btn-danger-sm">Delete Current Group</button>
    </div>
  </div>

  <main class="grid-container" id="taskGrid"></main>

  <script src="script.js"></script>
</body>
</html>
